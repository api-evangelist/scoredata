name: ScoreData
description: >-
  ScoreData Corporation is a Palo Alto based predictive-analytics and AI/ML
  platform company founded in 2014 by Danny Yang, Vas Bhandarkar, Mudit Chandra
  and Prasanta Behera. Its flagship ScoreFast platform, paired with iMaaS
  (intelligent Models as a Service), lets cross-functional AI teams develop,
  deploy, monitor, manage and govern machine-learning models in production
  across Banking, Insurance and Healthcare. ScoreFast uses patented dynamic
  machine learning that learns continuously, removing the need to manually
  regenerate predictive models, and its applications can be deployed across
  in-store, mobile, web, kiosk, chatbot and cloud contact-center touchpoints.
  ScoreData is backed by 500 Global and is tracked in the API Evangelist network
  as a portfolio-lead company awaiting a public developer/API surface.
